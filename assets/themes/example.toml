# FluxChat Custom Theme
# Place .toml theme files in: ~/Library/Application Support/fluxchat/themes/ (macOS)
#                              ~/.local/share/fluxchat/themes/ (Linux)
#
# Colors are [R, G, B] or [R, G, B, A] in 0-255.
# Any omitted color falls back to the FluxChat default.

name = "Example"
# dark = true (default) or dark = false for light themes
# This controls whether Iced uses dark or light widget styles (inputs, buttons, etc.)

# Backgrounds (darkest to lightest)
bg_deep = [26, 27, 30]
bg_dark = [34, 35, 39]
bg_mid = [42, 44, 49]
bg_light = [50, 53, 59]
bg_hover = [58, 61, 68]

# Text (brightest to dimmest)
text_bright = [228, 228, 231]
text_normal = [200, 201, 205]
text_muted = [139, 141, 147]
text_dim = [92, 94, 102]

# Accent colors
accent = [59, 130, 246]
green = [34, 197, 94]
yellow = [234, 179, 8]
red = [239, 68, 68]
purple = [168, 85, 247]

# Border
border = [255, 255, 255, 15]

# Code blocks
code_bg = [0, 0, 0, 76]
code_text = [200, 201, 205]
