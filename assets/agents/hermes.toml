# Hermes Agent (Nous Research) over its Matrix gateway.
# Read from its adapter: plugins/platforms/matrix/adapter.py
id = "hermes"
name = "Hermes Agent"
about = "Nous Research's self-improving agent, via its Matrix gateway"
url = "https://github.com/NousResearch/hermes-agent"

# Commands go out as `!name` (Matrix clients keep `/` for themselves).
command_prefix = "!"
stop = "stop"
steer = "steer"
queue = "queue"

# 👀 on your message while it works, then ✅ / ❌.
working_reaction = "👀"
done_reaction = "✅"
failed_reaction = "❌"
typing_means_working = false
# Replies go in a thread on your request (its `auto_thread`, on by default;
# not in DMs). The run is that thread's from the first 👀.
reply_in_thread = true

# One message edited a line per tool ("📖 Reading notes.md").
progress_steps = true
# `/footer on`: "model · 42% · ~/dir" under final answers.
runtime_footer = true

# Its clarify tool, as text on Matrix: "❓ question", "  1. choice" lines;
# you answer by replying with the number or your own words.
question_prefix = "❓"

# A timed-out approval is edited to "⌛ Approval timed out…" (reactions stay).
prompt_over_markers = ["⌛"]

# Approvals: the bot reacts to its own prompt with these; you react to answer.
approvals = [
  { emoji = "✅", label = "Approve once" },
  { emoji = "🌀", label = "For this session" },
  { emoji = "♾️", label = "Always" },
  { emoji = "❌", label = "Deny" },
]

menu = [
  { label = "Status", command = "status" },
  { label = "Usage and cost", command = "usage" },
  { label = "Context window", command = "context" },
  { label = "Switch model", command = "model" },
  { label = "New session", command = "new" },
]

