[package]
name = "fluxchat-core"
version = "0.1.0"
edition = "2021"

[dependencies]
matrix-sdk = { version = "0.16", features = ["e2e-encryption", "sqlite", "sso-login"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
mime = "0.3"
matrix-sdk-ui = "0.16"
open = "5"
