[package]
name = "fluxchat-core"
version = "0.1.0"
edition = "2021"

[dependencies]
matrix-sdk = { version = "0.18", features = ["e2e-encryption", "sqlite", "sso-login"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "6"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
mime = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
matrix-sdk-ui = "0.18"
open = "5"
reqwest = { version = "0.12", features = ["json"] }
livekit = { version = "0.7", features = ["native-tls"] }
cpal = "0.15"
uuid = { version = "1", features = ["v4"] }
opus = "0.3.1"
ogg = "0.9.2"
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
matrix-sdk-store-encryption = "0.18"
matrix-sdk-crypto = "0.18"
getrandom = "0.3"
# OS credential stores, all pure Rust (Secret Service over zbus, no libdbus).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
hayro = { version = "0.8", features = ["embed-fonts"] }
