[package]
name = "fluxchat"
version = "0.1.0"
edition = "2021"

[dependencies]
fluxchat-core = { path = "../core" }
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
open = "5"
base64 = "0.22"
matrix-sdk = "0.16"
matrix-sdk-ui = "0.16"
futures-util = "0.3"
async-stream = "0.3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
iced_gif = { version = "0.14", features = ["tokio"] }
emojis = "0.8"
chrono = "0.4"
notify-rust = "4.12.0"
