[package]
name = "fluxchat"
version = "0.1.0"
edition = "2021"

[dependencies]
fluxchat-core = { path = "../core" }
iced = { version = "0.14", features = ["image", "svg", "tokio", "advanced"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
open = "5"
base64 = "0.22"
matrix-sdk = "0.18"
futures-util = "0.3"
async-stream = "0.3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
html5ever = "0.35"
markup5ever = "0.35"
iced_gif = { version = "0.14", features = ["tokio"] }
image-webp = "0.2"
gif = "0.13"
emojis = "0.8"
chrono = "0.4"
notify-rust = "4.12.0"
unicodeit = "0.2.1"
fontdb = "0.23.0"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
iced_video_player = "0.6"
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-pbutils = "0.23"
url = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
