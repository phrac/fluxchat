[package]
name = "fluxchat"
version = "0.1.0"
description = "A cross-platform Matrix chat client"
authors = ["derek"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fluxchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
matrix-sdk = { version = "0.16", features = ["e2e-encryption", "sqlite"] }
fluxdb = { git = "https://github.com/phrac/fluxdb", default-features = false, features = ["persistence"] }
url = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
