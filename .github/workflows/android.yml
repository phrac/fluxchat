name: Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      # No keystore in CI: this falls back to the debug signing key (see
      # app/build.gradle.kts). Real signed releases are cut from reflux; this
      # job proves the release build itself compiles and shrinks.
      - name: Release build
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-unsigned
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
