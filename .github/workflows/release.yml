name: Release
# One tag vX.Y.Z → every desktop client's artifact on one GitHub Release.
# Android is NOT built here: the release keystore lives off GitHub (on
# reflux), so the signed APK is still cut locally and uploaded to the same
# release with `gh release upload` (see CLAUDE.md "Cutting a release").
# Windows is not built: see the PR that introduced this file for why.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from (e.g. v0.2.2)'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft (pipeline test, tag can be reused)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # gh release create/upload

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Release from the tag itself, whether triggered by push or dispatch.
          ref: ${{ inputs.tag || github.ref }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpulse-dev libasound2-dev libopus-dev libopusfile-dev libssl-dev \
            clang cmake ninja-build pkg-config
      - name: Build (build-linux.sh)
        run: ./build-linux.sh
      - name: Package tar.gz
        run: |
          VERSION="${TAG#v}"
          STAGE="fluxchat-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/fluxchat "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluxchat-linux-x86_64
          path: fluxchat-*-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: System dependencies (Homebrew)
        run: brew install pkg-config gstreamer
      - name: Build + bundle (build-macos.sh)
        env:
          # The gstreamer crates find the Homebrew libraries through pkg-config.
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/gstreamer/lib/pkgconfig
        run: ./build-macos.sh
      - name: Verify bundle
        run: |
          test -f target/release/FluxChat.app/Contents/Info.plist
          test -f target/release/FluxChat.app/Contents/MacOS/fluxchat
          codesign --verify --deep target/release/FluxChat.app
      - name: Package zip
        run: |
          VERSION="${TAG#v}"
          cd target/release
          ditto -c -k --sequesterRsrc "FluxChat.app" "FluxChat-${VERSION}-macos-$(uname -m).zip"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluxchat-macos
          path: target/release/FluxChat-*-macos-*.zip

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write release notes
        run: |
          VERSION="${TAG#v}"
          PREV=$(gh api repos/$GITHUB_REPOSITORY/releases \
            --jq "[.[] | select(.draft==false and .prerelease==false and .tag_name!=env.TAG) | .tag_name] | sort_by(. | ltrimstr(\"v\") | splits(\".\") | tonumber) | last // \"\"")
          {
            echo "## Desktop ${VERSION}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}: [compare](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG})"
              echo
            fi
            echo "### Desktop ${VERSION}"
            gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV:-HEAD~10}...${TAG}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' || true
            echo
            echo "### Linux: \`fluxchat-${VERSION}-linux-x86_64.tar.gz\`"
            echo
            echo "The binary links against system libraries — it is not static."
            echo "Install these before first run (video playback and voice calls):"
            echo
            echo '```'
            echo "# Debian/Ubuntu"
            echo "sudo apt install libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libpulse0 libasound2 libopusfile0"
            echo "# Fedora"
            echo "sudo dnf install gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good pulseaudio-libs alsa-lib opusfile"
            echo '```'
            echo
            echo "### macOS: \`FluxChat-${VERSION}-macos-*.zip\`"
            echo
            echo "Unzip and drag \`FluxChat.app\` to /Applications."
            echo
            echo "This build is **ad-hoc signed** (no Developer ID, no notarization —"
            echo "both are out of scope). Gatekeeper will block a double-click on a"
            echo "fresh download: right-click the app → **Open** → **Open** the first"
            echo "time only. Expect one Keychain and one microphone prompt on first"
            echo "launch."
          } > notes.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
      - name: Create release
        run: |
          ARGS=(--target "$TARGET" --title "FluxChat ${TAG}" --notes-file notes.md)
          if [ "$DRAFT" = "true" ]; then ARGS+=(--draft); fi
          gh release create "$TAG" "${ARGS[@]}" \
            artifacts/fluxchat-linux-x86_64/*.tar.gz \
            artifacts/fluxchat-macos/*.zip
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ github.event.repository.default_branch }}
          DRAFT: ${{ inputs.draft || 'false' }}
          GH_TOKEN: ${{ github.token }}
